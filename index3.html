<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS3</title>
  </head>
  <body>
    <script>
      let n = prompt("n = ");
      console.log("1. 1-100 hurtel hevle");
      let i = 0;
      while (i < 100) {
        i = i + 1;
        console.log(i);
      }
      console.log("2. 30-70hurtel hevle");
      i = 29;
      while (i < 70) {
        i = i + 1;
        console.log(i);
      }
      console.log("3. 20-1 hurtel hevel");
      i = 21;
      while (i > 1) {
        i = i - 1;
        console.log(i);
      }
      console.log("4. 1-n too hurtelh sondgoi (odd) toonuudiig hevle");
      i = 0;
      while (i <= n) {
        if (i % 2 !== 0) {
          console.log(i);
        }
        i = i + 1;
      }
      console.log("5. 1-n too hurtelh tegsh (even) toonuudiig hevle");
      i = 0;
      while (i <= n) {
        if (i % 2 == 0) {
          console.log(i);
        }
        i = i + 1;
      }
      console.log("6. 1-n too hurtelh 7-d huvaagddag toonuudiig hevle");
      i = 1;
      while (i <= n) {
        if (i % 7 == 0) {
          console.log(i);
        }
        i = i + 1;
      }
      console.log(
        "7. 1-n hurtelh 3 bolon 5t zereg huvaagddag toonuudiig hevle",
      );
      i = 1;
      while (i <= n) {
        if (i % 3 == 0 && i % 5 == 0) {
          console.log(i);
        }
        i = i + 1;
      }
      console.log("8. 1-n too hurtelh 7-d huvaagddag heden too baigaag tool");
      i = 1;
      let count = 0;
      while (i <= n) {
        if (i % 7 == 0) {
          count = count + 1;
        }
        i = i + 1;
      }
      console.log(count);
      console.log("9. Ogson string-d heden 'a' temdegt baigaag tool");
      let string = "javascript";
      let target = "a";
      count = 0;
      i = 0;
      while (i < string.length) {
        if (string[i] === target) {
          count = count + 1;
        }
        i = i + 1;
      }
      console.log(`${string} -> ${count}`);
      console.log("10. Ogson string-d heden egshig baigaag tool");
      i = 0;
      string = "String";
      const vowels = "aeiouAEIOU";
      count = 0;
      while (i < string.length) {
        if (vowels.includes(string[i])) {
          count = count + 1;
        }
        i = i + 1;
      }
      console.log(`${string}  -> ${count}`);
    </script>
  </body>
</html>
