<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <pre id="output"></pre>
    <script>
      let res = "";
      let i, j, k;
      let n = 5;
      //1
      for (i = 0; i < n; i++) {
        res += "* ";
      }
      res += "\n\n";

      //2
      for (i = 0; i < n; i++) {
        for (j = 0; j < n; j++) {
          res += "🃏 ";
        }
        res += "\n";
      }
      res += "\n";

      //3
      for (i = 0; i < n; i++) {
        for (j = 0; j < i + 1; j++) {
          res += "* ";
        }
        res += "\n";
      }
      res += "\n\n";

      //4
      for (i = 0; i < n; i++) {
        let m = n - i;
        for (k = 0; k < m; k++) {
          res += " ";
        }
        for (j = 0; j < i + 1; j++) {
          res += "* ";
        }
        res += "\n";
      }
      res += "\n\n";

      /*
       0.4____*0
       1.3___*_*1
       2.2__*___*3
       3.1_*_____*5
       4.0*_*_*_*_*
       */
      //5
      for (i = 0; i < n; i++) {
        let m = n - i - 1;

        for (k = 0; k < m; k++) {
          res += " ";
        }
        if (i == 0) {
          res += "* ";
        } else if (i == n - 1) {
          for (j = 0; j < n; j++) {
            res += "* ";
          }
        } else {
          res += "*";
          let n = 2 * i - 1;
          for (j = 0; j < n; j++) {
            res += " ";
          }
          res += "*";
        }
        res += "\n";
      }
      res += "\n\n";
      document.getElementById("output").textContent = res;
    </script>
  </body>
</html>
